# This workflow will do a clean install of node dependencies, build the source code and run the
# test suite. For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master, edge ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run lint
    - run: npm run check
    - run: npm run package
    - run: npm run build
    - run: npm run test:unit

    # Only chromium is installed: the suite runs a single browser project
    - name: Install playwright browser
      run: npx playwright install --with-deps chromium
    - run: npm run test:e2e

    - name: Upload playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
